name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check browser JavaScript syntax
        run: node --check docs/recent-errors.js && node --check docs/repo-filter.js && node --check docs/chart-markers.js && node --check docs/app.js

      - name: Run browser JavaScript tests
        run: npm test

      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Run Worker tests
        working-directory: cloudflare-worker
        run: npm test

      - name: Validate Worker configuration
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run

  # Dependabot の patch / minor 更新だけを、上の test ジョブが成功した後に自動マージする。
  # マージ可否をこのジョブ自身が CI 結果に結びつけているため、ブランチ保護や
  # "Allow auto-merge" の設定に依存しない。major や判定できない更新は何もせず、人が確認する。
  # Worker のデプロイは手動のままで、ここでのマージは本番の Worker を更新しない。
  automerge:
    name: Auto-merge Dependabot updates
    needs: test
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge when every update is patch or minor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          if echo "$UPDATES" | jq -e '
            length > 0 and
            all(.[]; .updateType == "version-update:semver-patch"
                  or .updateType == "version-update:semver-minor")
          ' > /dev/null; then
            gh pr merge --squash --delete-branch "$PR_URL"
          else
            echo "Not auto-merging (major update or unknown update type): leaving for manual review."
          fi
